<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AbhiBuddy</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bg-black text-white min-h-screen">

    <div id="app" class="min-h-screen">

        <!-- Header -->
        <header class="border-b border-white/10 px-6 py-4">
            <h1 class="text-2xl font-bold">
                AbhiBuddy
            </h1>

            <p class="text-sm text-gray-400">
                Your personal AI companion
            </p>
        </header>


        <!-- Main -->
        <main class="flex flex-col h-[calc(100vh-81px)]">
            <!-- Hologram -->
            <section
                id="hologram-container"
                class="w-full h-[320px] flex-shrink-0"
            ></section>

            <!-- Chat Messages -->
            <section
                id="chat-container"
                class="flex-1 overflow-y-auto p-6 space-y-4"
            >

                <!-- Messages will be inserted by JavaScript -->

            </section>


            <!-- Input Area -->
            <section class="border-t border-white/10 p-4">

                <form
                    id="chat-form"
                    class="max-w-4xl mx-auto flex gap-3"
                >

                    <input
                        id="message-input"
                        type="text"
                        placeholder="Talk to Abhinav..."
                        autocomplete="off"
                        class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-white/30"
                    >

                    <button
                        type="submit"
                        class="px-6 py-3 rounded-xl bg-white text-black font-semibold hover:bg-gray-200"
                    >
                        Send
                    </button>

                </form>

            </section>

        </main>

    </div>


    <!-- JavaScript -->
    <script type="module" src="./js/main.js"></script>

</body>
</html>
